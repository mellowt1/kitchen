<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen</title>
<meta name="description" content="The week's dinners, recipes, the shopping list and the pizza dough.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<meta name="theme-color" content="#F4EFE6">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-week" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M4 6h2l1.6 9.2a1.5 1.5 0 0 0 1.5 1.3h7.7a1.5 1.5 0 0 0 1.5-1.2L20 9H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></symbol>
  <symbol id="i-pizza" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1.2"/><circle cx="14.5" cy="9.5" r="1"/><circle cx="12.5" cy="14.5" r="1.3"/></symbol>
</svg>

<div id="nocode" class="nocode" hidden>
  <p class="nocode-title">Kitchen</p>
  <p>This kitchen opens from its private link. Ask Paul for it, then open it here once and it stays.</p>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <span class="brand">Kitchen</span>
    <nav class="pills" aria-label="Sections">
      <button type="button" class="pill-tab" data-tab="week">Week and shopping</button>
      <button type="button" class="pill-tab" data-tab="recipes">Recipes</button>
      <button type="button" class="pill-tab" data-tab="dough">Dough</button>
    </nav>
  </header>

  <main class="main">
    <div class="plan">
      <!-- Week -->
      <section id="v-week" class="view" aria-label="Week">
        <div class="head">
          <div class="titles">
            <span class="label" id="weekLabel"></span>
            <h1 class="h1" id="weekTitle">This week</h1>
          </div>
          <div class="arrows">
            <button type="button" class="round" id="prevWeek" aria-label="Previous week">‹</button>
            <button type="button" class="round" id="nextWeek" aria-label="Next week">›</button>
          </div>
        </div>
        <div id="mixBanner" class="banner" hidden>
          <svg width="22" height="22" class="ico" aria-hidden="true"><use href="#i-pizza"/></svg>
          <span id="mixText"></span>
        </div>
        <div id="days" class="card days"></div>
        <button type="button" id="thisWeek" class="quiet" hidden>Back to this week</button>
      </section>

      <!-- Shopping -->
      <section id="v-shop" class="view" aria-label="Shopping">
        <div class="head shop-head">
          <div class="titles">
            <span class="label"><span class="only-phone" id="shopWeek"></span><span class="only-wide" id="shopLeftWide"></span></span>
            <h1 class="h1">Shopping</h1>
          </div>
          <div class="shop-side only-phone">
            <span class="left" id="shopLeft"></span>
            <div class="arrows">
              <button type="button" class="round" id="shopPrev" aria-label="Previous week">‹</button>
              <button type="button" class="round" id="shopNext" aria-label="Next week">›</button>
            </div>
          </div>
          <form id="addForm" class="add" autocomplete="off">
            <label for="addInput" class="sr">Add an item</label>
            <input id="addInput" placeholder="Add an item" maxlength="200" enterkeyhint="done">
            <button type="submit" class="add-btn" aria-label="Add">+</button>
          </form>
        </div>
        <div id="shopList" class="shop-list"></div>
        <button type="button" id="untickAll" class="quiet" hidden>Untick all</button>
      </section>
    </div>

    <!-- Recipes -->
    <section id="v-recipes" class="view narrow" aria-label="Recipes">
      <div id="recipesHome">
        <div class="head">
          <div class="titles">
            <span class="label" id="recipeCount"></span>
            <h1 class="h1">Recipes</h1>
          </div>
          <button type="button" class="btn btn-red btn-small" id="newRecipe">Add a recipe</button>
        </div>
        <div class="filters">
          <button type="button" class="chip" id="vegOnly" aria-pressed="false">Vegetarian only</button>
          <label for="findRecipe" class="sr">Find a recipe</label>
          <input id="findRecipe" class="find" type="search" placeholder="Find a recipe" autocomplete="off">
        </div>
        <div id="recipeList" class="card list"></div>
      </div>

      <div id="recipeView" hidden></div>

      <form id="recipeForm" class="form" hidden autocomplete="off" novalidate>
        <div class="head">
          <div class="titles">
            <span class="label" id="formLabel">New recipe</span>
            <h1 class="h1" id="formTitle">Add a recipe</h1>
          </div>
        </div>
        <div class="card form-card">
          <label class="field"><span class="label">Title</span><input id="fTitle" maxlength="200" placeholder="Chickpea and spinach curry"></label>
          <div class="field-row">
            <label class="field"><span class="label">Servings</span><input id="fServings" type="number" inputmode="numeric" min="1" max="50" value="2"></label>
            <label class="field"><span class="label">Time</span><input id="fTime" maxlength="40" placeholder="35 min"></label>
          </div>
          <label class="check-row">Vegetarian<input id="fVeg" type="checkbox"></label>

          <span class="label">Ingredients</span>
          <div id="fIngredients" class="ing-rows"></div>
          <button type="button" class="btn btn-line btn-small" id="addIng">Add an ingredient</button>

          <label class="field"><span class="label">Method</span><textarea id="fSteps" rows="6" placeholder="One step per line"></textarea></label>
          <label class="field"><span class="label">Notes</span><textarea id="fNotes" rows="3" maxlength="4000" placeholder="Anything worth remembering"></textarea></label>
          <p id="formError" class="form-error" role="alert" hidden></p>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-red grow">Save</button>
          <button type="button" class="btn btn-line" id="cancelForm">Cancel</button>
        </div>
        <datalist id="units"><option value="g"><option value="kg"><option value="ml"><option value="l"><option value="tsp"><option value="tbsp"><option value="tins"><option value="cloves"><option value="pinch"><option value="bunch"><option value="pack"></datalist>
      </form>
    </section>

    <!-- Dough -->
    <section id="v-dough" class="view" aria-label="Pizza dough">
      <div class="head">
        <div class="titles">
          <span class="label">New York style</span>
          <h1 class="h1">Pizza dough</h1>
        </div>
      </div>
      <div class="dough-grid">
        <div class="dough-a">
          <div class="card settings">
            <div class="set-row">
              <span>Size</span>
              <div class="stepper"><button type="button" data-step="size" data-by="-1" aria-label="Smaller">−</button><span id="dSize"></span><button type="button" data-step="size" data-by="1" aria-label="Bigger">+</button></div>
            </div>
            <div class="set-row">
              <span>Pizzas</span>
              <div class="stepper"><button type="button" data-step="count" data-by="-1" aria-label="Fewer">−</button><span id="dCount"></span><button type="button" data-step="count" data-by="1" aria-label="More">+</button></div>
            </div>
            <div class="seg" role="radiogroup" aria-label="Thickness">
              <button type="button" role="radio" data-thick="thin">Thin</button>
              <button type="button" role="radio" data-thick="regular">Regular</button>
              <button type="button" role="radio" data-thick="thick">Thick</button>
            </div>
            <label class="check-row">Gluten free<input id="dGf" type="checkbox"></label>
          </div>

          <div class="bigs">
            <div class="big big-red"><span class="big-label">Each ball</span><span class="big-num" id="dBall"></span></div>
            <div class="big"><span class="big-label">Flour</span><span class="big-num" id="dFlour"></span></div>
          </div>

          <ul id="dRows" class="dough-rows"></ul>
        </div>

        <div class="dough-b">
          <div class="night">
            <span class="night-label">Pizza night</span>
            <span class="night-title" id="nTitle"></span>
            <span class="night-body" id="nBody"></span>
            <label class="night-date"><span>Pizza night</span><input id="nDate" type="date"></label>
            <div class="night-btns">
              <button type="button" class="btn btn-red btn-mid" id="nWeek">Add to the week</button>
              <button type="button" class="btn btn-soft btn-mid" id="nShop">Add to shopping</button>
            </div>
          </div>

          <p class="bake"><b>Stone or steel:</b> <span id="bakeNote"></span></p>

          <details class="method">
            <summary>Method</summary>
            <ol id="dSteps" class="steps"></ol>
          </details>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" class="tab" data-tab="week"><svg width="24" height="24" aria-hidden="true"><use href="#i-week"/></svg>Week</button>
    <button type="button" class="tab" data-tab="recipes"><svg width="24" height="24" aria-hidden="true"><use href="#i-book"/></svg>Recipes</button>
    <button type="button" class="tab" data-tab="shop"><svg width="24" height="24" aria-hidden="true"><use href="#i-cart"/></svg>Shopping</button>
    <button type="button" class="tab" data-tab="dough"><svg width="24" height="24" aria-hidden="true"><use href="#i-pizza"/></svg>Dough</button>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo" hidden>Undo</button></div>
  <button type="button" id="syncPill" class="sync" hidden></button>
</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
